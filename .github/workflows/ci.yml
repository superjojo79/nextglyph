name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Données linguistiques (~100 Mo, :tools:fetchData) : le cache évite de les retélécharger à chaque
      # exécution. La clé ne dépend que des empreintes de sources.json (ajouter un miroir ne l'invalide
      # pas) ; à défaut, le cache le plus récent est restauré et fetchData ne remplace que les fichiers
      # dont l'empreinte diffère. Les lexiques (assets de l'APK) sont reconstruits à partir de ces
      # données par :tools:buildLexicons, dont dépend l'application.
      - uses: ./.github/actions/lexicon-data

      # `build` compile aussi le module ime : il lui faut le SDK Android et les lexiques (assets).
      - uses: ./.github/actions/android-sdk

      - name: Compiler, tester et contrôler la convention de tests (construit les lexiques)
        run: ./gradlew build --console=plain

      - name: Publier les rapports de tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-tests
          path: "**/build/reports/tests/"
          retention-days: 14

  # Un job par module, en parallèle : PIT sur engine et tools dépassait 30 minutes dans un seul job.
  mutation:
    name: Tests de mutation (PIT, ${{ matrix.module }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [engine, tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: ./.github/actions/android-sdk

      - name: Lancer PIT (échoue sous les seuils de mutation et de couverture)
        run: ./gradlew :${{ matrix.module }}:pitest --console=plain

      - name: Publier le rapport PIT
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-pitest-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/pitest/
          retention-days: 14

  fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ClusterFuzzLite (.clusterfuzzlite/) : construit les cibles Jazzer du moteur dans l'image
      # OSS-Fuzz JVM, puis les fait tourner (docs/TESTING.md, « Tests de fuzzing »).
      - name: Construire les cibles de fuzzing
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Durée totale répartie entre les cibles (environ une minute chacune).
      - name: Fuzzer les décodeurs de fichiers (Jazzer)
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          mode: code-change
          fuzz-seconds: 600
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Application Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Mêmes données linguistiques que le job « Build et tests » (cache partagé par la clé).
      - uses: ./.github/actions/lexicon-data

      # Le runner fournit un SDK Android ; on ne télécharge que ce qui manque.
      - uses: ./.github/actions/android-sdk

      - name: Lint, tests unitaires et APK de debug (construit les lexiques)
        run: ./gradlew :ime:lintFdroidDebug :ime:lintPlayDebug :ime:testFdroidDebugUnitTest :ime:testPlayDebugUnitTest :ime:assembleDebug --console=plain

      - name: Publier l'APK de debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-debug
          path: ime/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier les rapports (lint, tests)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-android
          path: |
            ime/build/reports/
          retention-days: 14

  reproducible:
    name: Build reproductible
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # 21 pour le second build (JDK de la recette F-Droid), 25 par défaut (celui de la release).
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - uses: ./.github/actions/lexicon-data

      - uses: ./.github/actions/android-sdk

      # §18.1 : deux builds de l'APK de release (non signé) depuis deux dossiers différents, sans
      # cache de build, doivent être identiques à l'octet près (lexiques compris). Le second build tourne
      # avec le JDK 21, comme la recette F-Droid : F-Droid ne publie notre APK signé que si son build est identique.
      - name: Construire deux fois l'APK de release et comparer
        env:
          REPRO_JAVA_HOME_2: ${{ env.JAVA_HOME_21_X64 }}
        run: scripts/check-reproducible.sh

      - name: Publier les deux APK en cas d'écart
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-non-reproductibles
          path: ${{ runner.temp }}/reproductible/
          retention-days: 14

  dependency-review:
    name: Revue des dépendances
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bloquer les dépendances vulnérables ou à licence incompatible
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later

  dependency-submission:
    name: Graphe de dépendances
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: ./.github/actions/android-sdk

      - name: Envoyer le graphe à GitHub (alertes Dependabot sur les dépendances Gradle)
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
