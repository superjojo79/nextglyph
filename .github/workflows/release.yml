name: Release

# Publie une release GitHub à chaque tag vX.Y.Z (spec §18.2) : APK de release signé avec la clé du
# projet, son empreinte SHA-256 et son attestation de provenance (SLSA, signée via Sigstore). L'app bundle signé (Google Play) reste un artefact du workflow.
# La clé n'est jamais dans le dépôt : elle vient des secrets de l'environnement « release »
# (procédure dans docs/PUBLISHING.md).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: APK signé et release GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
      # Attestation de provenance : jeton OIDC pour Sigstore, écriture dans l'API des attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier que le tag correspond à versionName
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          name="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' ime/build.gradle.kts)"
          code="$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' ime/build.gradle.kts)"
          [ "$tag" = "$name" ] || { echo "::error::Le tag v$tag ne correspond pas à versionName ($name)"; exit 1; }
          for locale in fr-FR en-US; do
            [ -s "fastlane/metadata/android/$locale/changelogs/$code.txt" ] \
              || { echo "::error::Notes de version manquantes : fastlane/metadata/android/$locale/changelogs/$code.txt"; exit 1; }
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Vérifier l'intégrité du wrapper Gradle
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # Pas de cache Gradle pour une release : tout est reconstruit depuis les sources.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - uses: ./.github/actions/lexicon-data

      - uses: ./.github/actions/android-sdk

      - name: Construire l'APK de release signé
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXTGLYPH_KEYSTORE_BASE64 }}
          NEXTGLYPH_KEYSTORE_PASSWORD: ${{ secrets.NEXTGLYPH_KEYSTORE_PASSWORD }}
          NEXTGLYPH_KEY_ALIAS: ${{ secrets.NEXTGLYPH_KEY_ALIAS }}
          NEXTGLYPH_KEY_PASSWORD: ${{ secrets.NEXTGLYPH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret NEXTGLYPH_KEYSTORE_BASE64 absent de l'environnement release"; exit 1; }
          export NEXTGLYPH_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$NEXTGLYPH_KEYSTORE"
          # APK pour GitHub et F-Droid ; app bundle pour Google Play (envoi manuel, docs/PUBLISHING.md).
          ./gradlew :ime:assembleRelease :ime:bundleRelease --no-build-cache --console=plain
          rm -f "$NEXTGLYPH_KEYSTORE"

      - name: Vérifier la signature et calculer l'empreinte
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/37.0.0)/apksigner"
          mkdir -p dist
          cp ime/build/outputs/apk/release/ime-release.apk "dist/nextglyph-$VERSION.apk"
          "$apksigner" verify --verbose --print-certs "dist/nextglyph-$VERSION.apk"
          (cd dist && sha256sum "nextglyph-$VERSION.apk" > "nextglyph-$VERSION.apk.sha256" && cat ./*.sha256)

      # Prouve que l'APK sort de ce workflow, à ce commit. Vérification : docs/PUBLISHING.md §5.
      - name: Attester la provenance de l'APK
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nextglyph-${{ steps.version.outputs.name }}.apk

      - name: Joindre l'attestation à la release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.version.outputs.name }}
        run: cp "$BUNDLE" "dist/nextglyph-$VERSION.apk.sigstore.json"

      - name: Conserver l'app bundle pour Google Play
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextglyph-${{ steps.version.outputs.name }}-google-play
          path: ime/build/outputs/bundle/release/ime-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          {
            echo "## Français"
            echo
            cat "fastlane/metadata/android/fr-FR/changelogs/$CODE.txt"
            echo
            echo "## English"
            echo
            cat "fastlane/metadata/android/en-US/changelogs/$CODE.txt"
            echo
            echo "SHA-256 : \`$(cut -d' ' -f1 "dist/nextglyph-$VERSION.apk.sha256")\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "dist/nextglyph-$VERSION.apk" "dist/nextglyph-$VERSION.apk.sha256" \
            "dist/nextglyph-$VERSION.apk.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Nextglyph $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
